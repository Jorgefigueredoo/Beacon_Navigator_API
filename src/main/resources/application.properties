spring.application.name=beacon-navigator
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

app.auth.cookie-secure=${APP_COOKIE_SECURE:false}
app.auth.cookie-max-age=${APP_COOKIE_MAX_AGE:3600}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.forward-headers-strategy=framework
