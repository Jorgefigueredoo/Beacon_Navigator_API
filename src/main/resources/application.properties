spring.application.name=beacon-navigator

# Escolhe o profile via variável de ambiente (recomendado)
# Ex.: SPRING_PROFILES_ACTIVE=dev ou prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Porta (nuvem pode setar PORT)
server.port=${PORT:8080}

# Uploads
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# Frontend (redirect do OAuth2)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Cookie do JWT (para OAuth2 -> cookie HttpOnly)
app.auth.cookie-secure=${APP_COOKIE_SECURE:false}
app.auth.cookie-max-age=${APP_COOKIE_MAX_AGE:3600}
