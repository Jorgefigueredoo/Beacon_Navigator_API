# =========================
# Banco de dados (DEV)
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/beacon_navigator?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME_DEV:root}
spring.datasource.password=${DB_PASSWORD_DEV:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate (DEV)
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# JWT (DEV)
# =========================
jwt.secret=${JWT_SECRET_DEV:}
jwt.expiration-minutes=${JWT_EXP_MINUTES:120}

# =========================
# Erros (DEV)
# =========================
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=always
server.error.whitelabel.enabled=false

# =========================
# Google OAuth2 Login (DEV)
# =========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=email
